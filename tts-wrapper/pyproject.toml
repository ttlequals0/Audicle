[project]
name = "audicle-tts-wrapper"
version = "0.56.1"
description = "FastAPI TTS wrapper for Audicle (Chatterbox)."
requires-python = ">=3.11,<3.14"
# The wrapper's Python is set by the Dockerfiles' python:3.11-slim base. The bound
# tracks chatterbox-tts's torch==2.6.0 pin (torch 2.6.0 ships no cp314 wheels), not by
# numpy -- chatterbox already supports 3.13 (numpy>=2 there), but a newer Python would
# need a newer torch pin, which chatterbox will not allow until it moves off 2.6.0.
# The <3.14 upper bound mirrors that torch boundary; it lifts when Chatterbox bumps torch
# (the chatterbox-monitor workflow flags that). Backend is python:3.14-slim; the wrapper
# trails it deliberately, and each package has its own venv.
license = { text = "MPL-2.0" }
authors = [{ name = "ttlequals0" }]

# Core deps are engine-agnostic: the FastAPI wrapper, validation, and numpy for
# WAV encoding. The TTS engine and the ASR backend are optional extras (below) so
# the dev/test environment installs neither heavy stack.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26,<3.0",
]

# chatterbox: Resemble AI's actively maintained zero-shot clone model (Turbo).
# torch/torchaudio are declared directly (unpinned; chatterbox's == pin still
# decides the version) ONLY so [tool.uv.sources] can point them at the CPU
# index -- uv sources never redirect purely transitive deps.
[project.optional-dependencies]
chatterbox = ["chatterbox-tts>=0.1.7", "torch", "torchaudio"]
# whisper: optional faster-whisper (CTranslate2) ASR for the post-TTS verification
# pass. CTranslate2 is independent of the engine's torch stack. Installed into
# every image but import-gated at runtime by WHISPER_ENABLED -- the model only
# loads when an operator turns verification on.
whisper = ["faster-whisper>=1.0"]
# NOTE: chatterbox-tts 0.1.7 hard-pins several transitive deps that carry open
# advisories (HIGH unless noted), none reachable in this wrapper:
#   * ``diffusers==0.29.0`` -- CVE-2026-44513 / CVE-2026-45804, ``trust_remote_code``
#     / TOCTOU remote-code-load bypasses (fixed in 0.38.0). Chatterbox imports
#     diffusers only for its flow-matching decoder, never sets ``trust_remote_code``,
#     and the wrapper loads only trusted Chatterbox weights.
#   * ``gradio==6.8.0`` -- GHSA-7hp7-4p35-3cx2 cookie injection (fixed in 6.15.0),
#     GHSA-6655-8ph2-63j3 audio cache-key collision (fixed in 6.15.1), and, via
#     ``starlette<1.0``, CVE-2026-48818 / CVE-2026-54283 ``request.form()``
#     DoS (fixed in starlette 1.1.0 / 1.3.1). The wrapper never starts a gradio
#     server or imports gradio, and exposes only JSON/GET endpoints (no form parsing).
#   * ``transformers==5.2.0`` -- GHSA-29pf-2h5f-8g72 remote code execution (fixed in
#     5.3.0) and GHSA-fgcw-684q-jj6r LightGlue model-load code execution (fixed in
#     5.5.0). Both are reached through loading an untrusted model/config; the wrapper
#     only loads the fixed, trusted Chatterbox model (never ``trust_remote_code``).
#   * ``torch==2.6.0`` -- GHSA-rrmf-rvhw-rf47 ``torch.jit.script`` memory corruption
#     (LOW, fixed in 2.13.0). The wrapper never calls ``torch.jit.script``, let alone
#     on untrusted input.
# All are blocked by chatterbox's exact pins under the torch==2.6.0 constraint
# (``uv lock --upgrade-package gradio --upgrade-package transformers`` is a no-op);
# overriding them risks the TTS engine for zero real exposure reduction. No upstream
# relief -- 0.1.7 (latest) and master keep the pins, and the relax-pins PR
# (resemble-ai/chatterbox#486) is stale. Revisit when chatterbox-tts moves off them.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The wrapper is a flat layout of top-level modules. Declare them explicitly:
# modern setuptools refuses to auto-discover a flat layout with multiple
# top-level modules, which breaks ``pip install .`` on a current Python base
# image (older bases shipped a lenient setuptools that hid this).
[tool.setuptools]
py-modules = ["config", "engine", "main", "chatterbox_engine"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
package = false

# Dev/CI installs resolve torch from the CPU index: the lockfile otherwise pins
# PyPI torch 2.6.0, whose linux wheels drag the full nvidia-*-cu12 set (~7 GB)
# onto machines that never run GPU inference here. The shipped images are
# unaffected -- both wrapper Dockerfiles install torch with pip on their own.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
