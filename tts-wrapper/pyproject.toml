[project]
name = "audicle-tts-wrapper"
version = "0.56.9"
description = "FastAPI TTS wrapper for Audicle (Chatterbox)."
requires-python = ">=3.11,<3.14"
# The wrapper image uses Python 3.11. Keep the tested upper bound separate from
# the backend's Python version because the speech stack has its own native wheels.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ttlequals0" }]

# Core deps are engine-agnostic: the FastAPI wrapper, validation, and numpy for
# WAV encoding. The TTS engine and the ASR backend are optional extras (below) so
# the dev/test environment installs neither heavy stack.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26,<3.0",
]

# chatterbox: Resemble AI's actively maintained zero-shot clone model (Turbo).
# torch/torchaudio are declared directly (unpinned; chatterbox's == pin still
# decides the version) ONLY so [tool.uv.sources] can point them at the CPU
# index -- uv sources never redirect purely transitive deps.
[project.optional-dependencies]
chatterbox = [
    "chatterbox-tts>=0.1.7",
    "torch",
    "torchaudio",
    # resemble-perth imports pkg_resources, removed in setuptools 81.
    "setuptools>=78.1.1,<81",
]
# whisper: optional faster-whisper (CTranslate2) ASR for the post-TTS verification
# pass. CTranslate2 is independent of the engine's torch stack. Installed into
# every image but import-gated at runtime by WHISPER_ENABLED -- the model only
# loads when an operator turns verification on.
whisper = ["faster-whisper>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The wrapper is a flat layout of top-level modules. Declare them explicitly:
# modern setuptools refuses to auto-discover a flat layout with multiple
# top-level modules, which breaks ``pip install .`` on a current Python base
# image (older bases shipped a lenient setuptools that hid this).
[tool.setuptools]
py-modules = ["config", "engine", "main", "chatterbox_engine"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7,<0.16",
]

[tool.uv]
package = false
# Chatterbox's core package has no Gradio imports; Gradio is used only by its
# repository demo scripts and pins the wrapper server to vulnerable Starlette.
exclude-dependencies = ["gradio"]
override-dependencies = [
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "transformers==5.17.0",
    "diffusers==0.38.0",
    "safetensors==0.8.0",
]

# Dev/CI installs resolve torch from the CPU index: the lockfile otherwise pins
# PyPI torch, whose Linux wheels can pull the full NVIDIA dependency set,
# onto machines that never run GPU inference here. Each image preinstalls the
# matching wheel variant before installing the remaining locked dependencies.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
