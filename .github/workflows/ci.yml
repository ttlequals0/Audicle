name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv run ruff check

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      # The audio/chapters/chime tests shell out to ffmpeg; without it 4 tests
      # fail outright and 28 more skip.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run pytest

  test-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv run pytest
        working-directory: render

  test-tts-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      # tts-wrapper/uv.lock pins torch 2.6.0 from the CUDA index, so this job
      # downloads the multi-GB CUDA wheels onto a CPU runner. They import and
      # the tests pass; it is just heavy. UV_TORCH_BACKEND only affects
      # resolution, not an existing lockfile, so switching the lock to the cpu
      # index is the actual fix and is a follow-up.
      - run: uv run pytest
        working-directory: tts-wrapper

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: audicle-ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
