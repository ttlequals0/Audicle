name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job only checks out and runs tests or a throwaway image build, so the
# token needs nothing but read. Set here rather than per job: CodeQL's
# missing-workflow-permissions rule accepts the workflow-level grant, and one
# block cannot drift out of sync the way five copies can.
permissions:
  contents: read

# One source for the toolchain pins; the Dockerfiles carry the same values.
env:
  UV_VERSION: "0.13.1"
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv run --locked ruff check

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      # The audio/chapters/chime tests shell out to ffmpeg; without it 4 tests
      # fail outright and 28 more skip.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run --locked pytest

  test-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv run --locked pytest
        working-directory: render

  test-tts-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      # uv run syncs only the core + dev groups (the chatterbox extra, and with
      # it torch, is never installed here; the tests use the fake engine). The
      # lockfile also sources torch from the CPU index, so even a full
      # --all-extras sync stays off the multi-GB CUDA wheels.
      - run: uv run --locked pytest
        working-directory: tts-wrapper

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: audicle-ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-render-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: render/egress-proxy
          tags: audicle-render-egress-ci
          push: false
          cache-from: type=gha,scope=render-egress
          cache-to: type=gha,mode=max,scope=render-egress

  # Native arm64 build of every non-GPU image under QEMU. push: false, so this
  # only proves the images build for linux/arm64 (Apple Silicon, ARM servers).
  docker-build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
          - name: render
            context: render
            file: render/Dockerfile
          - name: tts-cpu
            context: tts-wrapper
            file: tts-wrapper/Dockerfile.cpu
          - name: render-egress
            context: render/egress-proxy
            file: render/egress-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          build-args: |
            WRAPPER_VERSION=${{ steps.version.outputs.value }}
          tags: audicle-${{ matrix.name }}-arm64-ci
          push: false
          cache-from: type=gha,scope=arm64-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.name }}

  # Runs the renderer behind the egress proxy, so a container that exits on start
  # (0.58.1: tinyproxy could not reopen /dev/stderr) fails CI, not the deploy.
  render-egress-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh render/tests/egress_integration.sh
