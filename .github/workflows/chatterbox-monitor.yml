name: Monitor Chatterbox upstream

# Weekly release and source checks. Schedules run from the default branch.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: chatterbox-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -m pip install packaging==26.2
      - name: Check Chatterbox releases and source updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_chatterbox.py
