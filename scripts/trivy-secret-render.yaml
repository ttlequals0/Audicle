# Secret-scan allow rule for the render image only (see scripts/trivy_gate.sh).
# Camoufox bundles uBlock Origin with a third-party malware-URL blocklist; one
# listed malicious URL looks like an Azure SAS token. Secret scanning stays on
# for every other path and image.
allow-rules:
  - id: ubo-bundled-blocklists
    description: Third-party URL blocklists bundled with the Camoufox uBlock Origin addon
    path: ^/home/render/\.cache/camoufox/addons/UBO/assets/thirdparties/
