# Secret-scan allow rule for the render image only (see scripts/trivy_gate.sh).
# Camoufox bundles uBlock Origin with a third-party malware-URL blocklist; one
# listed malicious URL looks like an Azure SAS token. Trivy applies a rule's path
# to the whole file, so the rule matches the lookalike text itself instead. Every
# other secret, in any file, is still reported.
allow-rules:
  - id: ubo-blocklist-azure-sas-lookalike
    description: Malicious URL in the bundled uBlock Origin blocklist that resembles an Azure SAS token
    regex: 'a53z&sks=b&skv=2018-11-09&sig='
